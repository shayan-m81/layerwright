name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Every platform Layerwright runs on: Figma desktop is macOS and Windows; sessions and CI run on Linux too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20 # the oldest Node Layerwright supports
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      # The Chromium build the pinned playwright-core expects (Linux also needs its system libraries).
      - run: npx playwright-core install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
