name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./apps/mcp-server/package.json').version")"
      - name: Zip the Figma plugin
        run: cd apps/figma-plugin && zip -r "../../layerwright-figma-plugin-${GITHUB_REF_NAME}.zip" manifest.json dist
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - name: Create GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" "layerwright-figma-plugin-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: npm publish --provenance --access public -w layerwright
